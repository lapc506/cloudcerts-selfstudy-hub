[package]
name = "cloudcerts-selfstudy-hub"
version = "0.1.0"
description = "CloudCert Hub - Certifications & Study Guides"
authors = ["kvttvrsis"]
edition = "2021"

[lib]
name = "cloudcerts_selfstudy_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
